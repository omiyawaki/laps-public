[workspace]
name = "laps-project"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.14,<3.15"
matplotlib = "3.10.9.*"
laspy = "2.7.0.*"
numpy = "2.4.4.*"
pillow = "12.2.0.*"
pyproj = "3.7.2.*"
pyyaml = "6.0.3.*"
rasterio = "1.5.0.*"
requests = "2.33.1.*"
scikit-image = "0.26.0.*"
scipy = "1.17.1.*"
shapely = "2.1.2.*"

[tasks]
check = "python -c \"import laspy, matplotlib, numpy, PIL, pyproj, rasterio, requests, scipy, shapely, skimage, yaml; print('Laps dependencies import ok')\""
